name: release deployment smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable candidate source SHA; empty verifies current offline-latest
        required: false
        type: string
      amd64_manifest_sha256:
        description: Required manifest SHA-256 for an explicit candidate
        required: false
        type: string
      arm64_manifest_sha256:
        description: Required manifest SHA-256 for an explicit candidate
        required: false
        type: string
  push:
    branches: [main]
    paths: [offline-latest.json]

permissions:
  contents: read

concurrency:
  group: release-deployment-smoke
  cancel-in-progress: false

jobs:
  install-deploy-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned candidate or promoted release identity
        id: release
        env:
          CANDIDATE_SOURCE: ${{ inputs.source_sha }}
          AMD64_DIGEST: ${{ inputs.amd64_manifest_sha256 }}
          ARM64_DIGEST: ${{ inputs.arm64_manifest_sha256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE_SOURCE" ]]; then
            [[ "$AMD64_DIGEST" =~ ^[0-9a-f]{64}$ && "$ARM64_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            source_sha="$CANDIDATE_SOURCE"
            if [[ "$ARCH" == amd64 ]]; then digest="$AMD64_DIGEST"; else digest="$ARM64_DIGEST"; fi
          else
            [[ -z "$AMD64_DIGEST" && -z "$ARM64_DIGEST" ]]
            source_sha=$(jq -r .source_sha offline-latest.json)
            digest=$(jq -r --arg platform "linux-$ARCH" '.architectures[$platform].manifest_sha256' offline-latest.json)
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=mcpgit-git-$source_sha-linux-$ARCH" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "instance=mcpgit-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Install exact immutable package and run baseline smoke
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/mcpgit-release-smoke"
          scripts/new_agent_public_install_smoke.sh \
            --instance "${{ steps.release.outputs.instance }}" \
            --port 18041 \
            --expected-source-sha "${{ steps.release.outputs.source_sha }}" \
            --release-tag "${{ steps.release.outputs.tag }}" \
            --manifest-sha256 "${{ steps.release.outputs.digest }}" \
            --install-revision "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/mcpgit-release-smoke/install.json" \
            --keep
      - name: Discover and smoke all three service surfaces
        run: |
          python3 scripts/service_interface_smoke.py \
            --base-url http://127.0.0.1:18041 \
            --expected-source-revision "${{ steps.release.outputs.source_sha }}" \
            --output "$RUNNER_TEMP/mcpgit-release-smoke/service-interfaces.json"
      - name: Verify persistence across a real container restart
        env:
          INSTANCE: ${{ steps.release.outputs.instance }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker restart "$INSTANCE" >/dev/null
          healthy=false
          for attempt in $(seq 1 90); do
            if [[ $(docker inspect "$INSTANCE" --format '{{.State.Health.Status}}') == healthy ]]; then healthy=true; break; fi
            sleep 2
          done
          [[ "$healthy" == true ]]
          "$HOME/.local/bin/mcpgitctl" --instance "$INSTANCE" --url http://127.0.0.1:18041 doctor
          python3 scripts/service_interface_smoke.py --base-url http://127.0.0.1:18041 \
            --expected-source-revision "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/mcpgit-release-smoke/restart-service-interfaces.json"
          organization_id=$(docker inspect "$INSTANCE" --format '{{index .Config.Labels "com.yxsicd.mcpgit.instance-id"}}')
          python3 scripts/agent_onboarding_probe.py --url http://127.0.0.1:18041 \
            --credential-file "$RUNNER_TEMP/${INSTANCE}-creds/${INSTANCE}-systemadmin.env" \
            --expected-instance-id "$organization_id" \
            > "$RUNNER_TEMP/mcpgit-release-smoke/restart-authenticated-agent.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-deployment-smoke-${{ github.run_id }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/mcpgit-release-smoke
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable deployment
        if: always()
        run: |
          instance="${{ steps.release.outputs.instance }}"
          [[ "$instance" =~ ^mcpgit-gha-[0-9]+-[0-9]+-(amd64|arm64)$ ]] || exit 0
          docker rm -f "$instance" >/dev/null 2>&1 || true
          docker volume rm "${instance}_data" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/${instance}-bundle" "$RUNNER_TEMP/${instance}-creds" "$RUNNER_TEMP/${instance}-install.sh"
          rm -f -- "$HOME/.mcpgit/instances/${instance}.toml"
